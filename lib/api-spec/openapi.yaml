openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Nix Ig Downloader API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: download
    description: Media download operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /download:
    post:
      operationId: downloadMedia
      tags: [download]
      summary: Download Instagram media
      description: Extracts downloadable media URLs from an Instagram post/reel/story URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadInput"
      responses:
        "200":
          description: Media extracted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResult"
        "400":
          description: Invalid URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to fetch media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DownloadInput:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: Instagram post, reel, or story URL
    MediaItem:
      type: object
      required:
        - url
        - type
      properties:
        url:
          type: string
          description: Direct download URL
        type:
          type: string
          enum: [video, image]
          description: Type of media
        thumbnail:
          type: ["string", "null"]
          description: Thumbnail URL for videos
    DownloadResult:
      type: object
      required:
        - success
        - media
      properties:
        success:
          type: boolean
        media:
          type: array
          items:
            $ref: "#/components/schemas/MediaItem"
        caption:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
